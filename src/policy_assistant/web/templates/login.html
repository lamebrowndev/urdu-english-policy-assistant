{% extends "base.html" %}
{% block content %}
  <h1>{{ t('login_title') }}</h1>
  {% if error %}
    <p class="banner" role="status" aria-live="polite">{{ error }}</p>
  {% endif %}
  <form method="post" action="/login" class="stack">
    <label for="username">{{ t('login_username') }}</label>
    <input id="username" name="username" type="text" autocomplete="username" required maxlength="64">
    <label for="password">{{ t('login_password') }}</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024">
    <button type="submit">{{ t('login_submit') }}</button>
  </form>
{% endblock %}
